name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    # 1. SOBE O BANCO DE TESTES (Exigência para o Spring Boot passar nos testes)
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigwms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # 2. RODA OS TESTES 
      - name: Build and Test backend
        run: mvn -f api/pom.xml clean package --batch-mode
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sigwms_test
          DB_USER: postgres
          DB_PASSWORD: test_password

  # 3. VALIDA SE AS IMAGENS DOCKER MULTI-STAGE ESTÃO FUCIONANDO (Etapa 2 da prática)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend] # Só builda o Docker se o teste do backend passar!
    steps:
      - uses: actions/checkout@v6

      - name: Build Backend Image
        run: docker build -t sigwms-backend ./api

      - name: Build Frontend Image
        run: docker build -t sigwms-frontend ./frontend