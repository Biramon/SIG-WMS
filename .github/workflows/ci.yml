name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and Test (H2)
        run: mvn -f api/pom.xml clean package --batch-mode -Dstyle.color=always

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Check TypeScript Errors
        run: cd frontend && npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Test Postgres Container Startup
        run: |
          docker run -d --name test-db \
            -e POSTGRES_DB=sigwms_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=secret \
            postgres:16-alpine

      - name: Build Backend Image
        run: docker build -t sigwms-backend ./api

      - name: Build Frontend Image
        run: docker build -t sigwms-frontend ./frontend

      - name: Verify Running Containers
        run: |
          sleep 5
          docker ps
          docker logs test-db