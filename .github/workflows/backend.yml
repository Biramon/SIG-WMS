name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "api/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigwms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn -f api/pom.xml clean package --batch-mode
        env:
          APP_PORT: 8080
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sigwms_test
          DB_USER: postgres
          DB_PASSWORD: test_password

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t sigwms-backend ./api