# Development Docker Compose configuration
# This configuration mounts the source files as volumes to enable hot-reloading

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reloading
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      # Mount node_modules to avoid reinstalling on every file change
      - node_modules:/app/node_modules
    # Watch mode is handled by Vite's HMR (Hot Module Replacement)
    # No additional watch flags needed - Vite auto-reloads on file changes

# Named volume for node_modules to persist across builds
volumes:
  node_modules: